[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprobe"
version = "0.1.0"
description = "Evaluate codebases through harnesses using local GGUF models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["llama-cpp-python"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reprobe*"]
