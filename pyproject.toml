[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprobe"
version = "0.1.0"
description = "Evaluate codebases through harnesses using local GGUF models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["llama-cpp-python", "gguf>=0.17.0", "pathspec>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reprobe = "reprobe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["reprobe*"]
